<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métabolites primaires et secondaires du fruit — Révisions</title>
<style>
  :root{
    --bg:#0f1117; --card:#181b24; --card2:#1f2330; --text:#e8e9ee; --muted:#9aa0ae;
    --accent:#5eead4; --accent2:#818cf8; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --border:#2a2f3d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f7; --card:#ffffff; --card2:#f0f1f5; --text:#1c1e26; --muted:#5b6172;
    --accent:#0d9488; --accent2:#4338ca; --border:#e2e4ea; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:820px; margin:0 auto; padding:24px 16px 64px;}
  header{ text-align:center; margin-bottom:24px; }
  header h1{ font-size:1.5rem; margin:0 0 4px; }
  header p{ color:var(--muted); margin:0; font-size:.9rem; }

  nav.tabs{ display:flex; gap:8px; justify-content:center; margin:20px 0; flex-wrap:wrap; }
  nav.tabs button{
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:.85rem; font-weight:600;
  }
  nav.tabs button.active{ background:var(--accent2); color:#fff; border-color:var(--accent2); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  select, button.primary{
    font-family:inherit; font-size:.9rem; padding:8px 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--card2); color:var(--text); cursor:pointer;
  }
  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:18px;}

  .progressbar{ height:8px; background:var(--card2); border-radius:999px; overflow:hidden; margin-bottom:18px; border:1px solid var(--border);}
  .progressbar > div{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .3s; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:24px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.08);
  }
  .qmeta{ display:flex; justify-content:space-between; color:var(--muted); font-size:.78rem; margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em;}
  .qtext{ font-size:1.08rem; font-weight:600; line-height:1.45; margin-bottom:18px; }

  .opts{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); cursor:pointer; font-size:.95rem; line-height:1.35;
    transition:transform .05s ease;
  }
  .opt:hover{ border-color:var(--accent2); }
  .opt.correct{ background:rgba(74,222,128,.15); border-color:var(--good); }
  .opt.incorrect{ background:rgba(248,113,113,.15); border-color:var(--bad); }
  .opt:disabled{ cursor:default; opacity:.85; }

  .explain{
    margin-top:16px; padding:14px; border-radius:10px; background:var(--card2);
    border-left:4px solid var(--accent); font-size:.9rem; line-height:1.5; display:none;
  }
  .explain.show{ display:block; }

  .navbtns{ display:flex; justify-content:space-between; margin-top:18px; }
  .navbtns button{
    background:var(--accent2); color:#fff; border:none; padding:10px 20px;
    border-radius:8px; cursor:pointer; font-weight:600; font-size:.9rem;
  }
  .navbtns button:disabled{ opacity:.35; cursor:default; }
  .navbtns button.ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }

  .scorebox{ text-align:center; padding:32px 20px; }
  .scorebox .big{ font-size:2.6rem; font-weight:800; margin:8px 0; }
  .scorebox .sub{ color:var(--muted); margin-bottom:20px; }

  /* Flashcards */
  .flashwrap{ perspective:1200px; }
  .flashcard{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    min-height:220px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:28px; cursor:pointer; font-size:1.05rem; line-height:1.5;
    position:relative;
  }
  .flashcard .tag{ position:absolute; top:14px; left:16px; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .flashcard .hint{ position:absolute; bottom:12px; font-size:.72rem; color:var(--muted); }
  .flash-answer{ color:var(--accent); font-weight:600; }

  .flashnav{ display:flex; justify-content:center; gap:12px; margin-top:16px; }
  .flashnav button{
    background:var(--card2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600;
  }
  .flashnav button.know{ background:rgba(74,222,128,.15); border-color:var(--good); }
  .flashnav button.dontknow{ background:rgba(248,113,113,.15); border-color:var(--bad); }

  .counter{ text-align:center; color:var(--muted); font-size:.85rem; margin-top:10px;}

  footer{ text-align:center; margin-top:40px; color:var(--muted); font-size:.75rem; }
  footer a{ color:var(--accent2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍅 Métabolites primaires et secondaires du fruit</h1>
    <p>D'après Génard et al., 2010 — QCM interactif + flashcards</p>
  </header>

  <nav class="tabs">
    <button data-tab="quiz" class="active">QCM</button>
    <button data-tab="flash">Flashcards</button>
  </nav>

  <!-- ================= QUIZ PANEL ================= -->
  <section id="panel-quiz" class="panel active">
    <div class="controls">
      <label for="cat-select" style="color:var(--muted); font-size:.85rem;">Catégorie :</label>
      <select id="cat-select"></select>
      <button class="primary" id="restart-quiz">🔄 Recommencer</button>
    </div>

    <div class="progressbar"><div id="quiz-progress"></div></div>

    <div id="quiz-question-area"></div>

    <div id="quiz-score-area" style="display:none;"></div>
  </section>

  <!-- ================= FLASHCARD PANEL ================= -->
  <section id="panel-flash" class="panel">
    <div class="controls">
      <label for="flash-cat-select" style="color:var(--muted); font-size:.85rem;">Catégorie :</label>
      <select id="flash-cat-select"></select>
      <button class="primary" id="shuffle-flash">🔀 Mélanger</button>
      <button class="primary" id="reset-flash">🔄 Réinitialiser</button>
    </div>

    <div class="flashwrap">
      <div class="flashcard" id="flashcard">
        <span class="tag" id="flash-tag"></span>
        <div id="flash-content">Chargement…</div>
        <span class="hint">clique pour retourner</span>
      </div>
    </div>
    <div class="flashnav">
      <button class="dontknow" id="btn-dontknow">😵 À revoir</button>
      <button id="btn-prev-flash">← Précédent</button>
      <button id="btn-next-flash">Suivant →</button>
      <button class="know" id="btn-know">✅ Su</button>
    </div>
    <div class="counter" id="flash-counter"></div>
  </section>

  <footer>
    Contenu généré à partir de "Elaboration de la qualité du fruit" (Génard et al., Innovations Agronomiques, 2010) — usage personnel de révision.
  </footer>
</div>

<script>
/* ============================================================
   DONNÉES — QCM

const QUESTIONS = [

  {

    correct: 1,
    explain: "Les acides citrique et malique augmentent pendant la croissance du fruit, puis diminuent fortement pendant la maturation (leur dynamique varie selon les génotypes)."
  },
  {

  },

      "Répartis uniformément dans tout le fruit"

    explain: "Les flavonoïdes sont majoritairement localisés dans la partie externe du fruit : la peau et le péricarpe."
  },
  {

      "Uniquement dans les feuilles"

  },
  {

    explain: "L'acide chlorogénique est le composé phénolique le plus abondant ; sa concentration est maximale au stade fruit vert et chute pendant le mûrissement. À l'inverse, la rutine et les dérivés de l'acide caféique augmentent dans le fruit mûr."

const FLASHCARDS = [
  {cat:"Croissance", q:"Quels sont les 2 processus qui composent la croissance du fruit ?", a:"La multiplication cellulaire (précoce, fixe le nombre de cellules) et la croissance cellulaire (expansion, moteur = pression de turgescence)."},
  {cat:"Croissance", q:"Qu'est-ce qui est le moteur de la croissance cellulaire ?", a:"La pression de turgescence, dépendante de l'approvisionnement en eau et de la richesse en solutés."},
  {cat:"Croissance", q:"Une baisse de température pendant la division cellulaire chez la tomate a quel effet ?", a:"Elle allonge la période de division → augmentation du nombre de cellules produites par fruit."},
  {cat:"Croissance", q:"De quoi résultent les variations de volume du fruit (bilan de flux) ?", a:"Du bilan entrées (eau/carbone via xylème et phloème) moins sorties (transpiration et respiration)."},
  {cat:"Composition", q:"Quels sont les 4 processus déterminant la composition du fruit ?", a:"1) Transport depuis d'autres organes, 2) synthèse dans le fruit, 3) utilisation (respiration / synthèse d'amidon ou autres composés), 4) dilution dans l'eau."},
  {cat:"Composition", q:"Comment évolue l'amidon chez la tomate cerise au cours du développement ?", a:"Il augmente dans les phases précoces (jusqu'à ~14 jours après floraison) puis décroît jusqu'à maturité."},
  {cat:"Composition", q:"Comment évoluent les acides citrique et malique pendant le développement du fruit ?", a:"Ils augmentent pendant la croissance puis diminuent fortement pendant la maturation."},
  {cat:"Composition", q:"Plus il y a d'eau dans le fruit, que se passe-t-il pour la concentration des composés ?", a:"Elle diminue : c'est le phénomène de dilution."},
  {cat:"Vitamine C", q:"Comment évolue la vitamine C au cours du développement du fruit de tomate ?", a:"Elle diminue en début de développement (dilution), diminue lentement, puis augmente rapidement pendant la maturation."},
  {cat:"Vitamine C", q:"Que montre l'étude de Massot et al. (2010) sur le lien sucre/vitamine C ?", a:"La corrélation observée n'est pas une liaison fonctionnelle : augmenter les sucres (via réduction de charge en fruits) n'augmente pas la vitamine C."},
  {cat:"Vitamine C", q:"Ombrage des feuilles vs ombrage du fruit : lequel a le plus d'impact sur la vitamine C du fruit ?", a:"L'ombrage du FRUIT a l'effet le plus marqué (microclimat lumineux du fruit) ; l'ombrage des feuilles ne fait que légèrement la diminuer."},
  {cat:"Métabolites secondaires", q:"Cite les 4 grandes familles de voies de métabolisme secondaire mentionnées.", a:"Phénylpropanoïdes (flavonoïdes, polyphénols), alcaloïdes, terpénoïdes, caroténoïdes."},
  {cat:"Métabolites secondaires", q:"Où se trouvent majoritairement les flavonoïdes dans le fruit ?", a:"Dans la partie externe : peau et péricarpe."},
  {cat:"Métabolites secondaires", q:"Où se trouvent majoritairement les acides hydroxycinnamiques ?", a:"Dans la chair, les graines, et le gel qui les entoure."},
  {cat:"Métabolites secondaires", q:"Quel est le composé phénolique le plus abondant de la tomate, et son évolution ?", a:"L'acide chlorogénique — concentration maximale au stade vert, chute pendant le mûrissement."},
  {cat:"Métabolites secondaires", q:"Quels composés phénoliques augmentent au contraire dans le fruit mûr ?", a:"La rutine et les dérivés de l'acide caféique."},
  {cat:"Pratiques culturales", q:"Effet d'une densité de plantation plus faible sur le fruit ?", a:"Favorise la photosynthèse et augmente matière sèche, sucres, lycopène et vitamine C (poids du fruit aussi en hausse)."},
  {cat:"Pratiques culturales", q:"Effet d'une réduction de la charge en fruits (ablation de fleurs) ?", a:"Favorise l'accumulation de matière sèche et de sucres solubles dans les fruits restants."},
  {cat:"Pratiques culturales", q:"Effet d'une réduction de la fertilisation azotée sur sucres/acides ?", a:"Sucres augmentent, acides diminuent → ratio sucres/acides (qualité gustative) fortement augmenté ; polyphénols tendent à augmenter, caroténoïdes inchangés."},
  {cat:"Pratiques culturales", q:"Effet d'une réduction d'irrigation ou d'une eau très saline sur la composition ?", a:"Réduit l'entrée d'eau dans le fruit → limite la dilution → sucres et autres composés plus concentrés."},
  {cat:"Environnement", q:"Effet d'une hausse de température du fruit de 27 à 32°C sur les phénols ?", a:"Réduit les dérivés de l'acide caféique, augmente la rutine et les glucosides de l'acide caféique."},
  {cat:"Environnement", q:"Comment la composition diffère-t-elle entre tomates d'été et d'hiver ?", a:"Été : + sucres, acides, vitamine C, rutine. Hiver : + lycopène (sa synthèse est inhibée par forte température)."},
  {cat:"Modèle Fruit Virtuel", q:"Combien de sous-modèles regroupe le 'Fruit Virtuel' ?", a:"Sept (carbone, sucres, eau, conductance de la peau, respiration, éthylène, citrate)."},
  {cat:"Modèle Fruit Virtuel", q:"Dans le schéma du Fruit Virtuel, que représentent le rouge et le bleu ?", a:"Rouge = variables d'entrée ; Bleu = variables prédites (sorties) du modèle."},
  {cat:"Modèle Fruit Virtuel", q:"Que montre la comparaison stress hydrique ponctuel vs continu avec le Fruit Virtuel ?", a:"Un stress après bonne irrigation diminue fortement la croissance, alors qu'un stress continu permet une croissance continue → les fruits peuvent s'adapter au stress."}
];

/* ============================================================
   ÉTAT
   ============================================================ */
let quizPool = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

let flashPool = [];
let flashIndex = 0;
let flashFlipped = false;
let flashKnown = new Set();

const catsFromQuestions = [...new Set(QUESTIONS.map(q => q.cat))];
const catsFromFlash = [...new Set(FLASHCARDS.map(f => f.cat))];

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ============================================================
   QUIZ LOGIC
   ============================================================ */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function populateCatSelect(){
  const sel = document.getElementById('cat-select');
  sel.innerHTML = '<option value="all">Toutes les catégories (' + QUESTIONS.length + ')</option>' +
    catsFromQuestions.map(c => {
      const n = QUESTIONS.filter(q=>q.cat===c).length;
      return `<option value="${c}">${c} (${n})</option>`;
    }).join('');

  const fsel = document.getElementById('flash-cat-select');
  fsel.innerHTML = '<option value="all">Toutes les catégories (' + FLASHCARDS.length + ')</option>' +
    catsFromFlash.map(c => {
      const n = FLASHCARDS.filter(f=>f.cat===c).length;
      return `<option value="${c}">${c} (${n})</option>`;
    }).join('');
}

function startQuiz(){
  const cat = document.getElementById('cat-select').value;
  const source = cat === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.cat === cat);
  quizPool = shuffle(source);
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  document.getElementById('quiz-score-area').style.display = 'none';
  document.getElementById('quiz-question-area').style.display = 'block';
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const area = document.getElementById('quiz-question-area');
  if(quizPool.length === 0){
    area.innerHTML = '<p style="text-align:center;color:var(--muted)">Aucune question dans cette catégorie.</p>';
    return;
  }
  const item = quizPool[quizIndex];
  quizAnswered = false;

  document.getElementById('quiz-progress').style.width =
    Math.round((quizIndex / quizPool.length) * 100) + '%';

  const optOrder = shuffle(item.options.map((text, i) => ({text, isCorrect: i === item.correct})));

  area.innerHTML = `
    <div class="card">
      <div class="qmeta"><span>${item.cat}</span><span>Question ${quizIndex+1} / ${quizPool.length}</span></div>
      <div class="qtext">${item.q}</div>
      <div class="opts">
        ${optOrder.map((o,i) => `<button class="opt" data-correct="${o.isCorrect}" data-idx="${i}">${o.text}</button>`).join('')}
      </div>
      <div class="explain" id="quiz-explain">${item.explain}</div>
      <div class="navbtns">
        <button class="ghost" id="quiz-prev" ${quizIndex===0 ? 'disabled':''}>← Précédent</button>
        <button id="quiz-next" disabled>Suivant →</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if(quizAnswered) return;
      quizAnswered = true;
      const correct = btn.dataset.correct === 'true';
      if(correct) quizScore++;
      document.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if(b.dataset.correct === 'true') b.classList.add('correct');
        else if(b === btn) b.classList.add('incorrect');
      });
      document.getElementById('quiz-explain').classList.add('show');
      document.getElementById('quiz-next').disabled = false;
    });
  });

  document.getElementById('quiz-prev').addEventListener('click', () => {
    if(quizIndex>0){ quizIndex--; renderQuizQuestion(); }
  });
  document.getElementById('quiz-next').addEventListener('click', () => {
    if(quizIndex < quizPool.length - 1){
      quizIndex++;
      renderQuizQuestion();
    } else {
      showQuizScore();
    }
  });
}

function showQuizScore(){
  document.getElementById('quiz-progress').style.width = '100%';
  document.getElementById('quiz-question-area').style.display = 'none';
  const area = document.getElementById('quiz-score-area');
  area.style.display = 'block';
  const pct = Math.round((quizScore/quizPool.length)*100);
  let msg = "Continue à réviser 💪";
  if(pct >= 80) msg = "Excellent, tu maîtrises bien ! 🎉";
  else if(pct >= 60) msg = "Pas mal, encore quelques révisions 👍";
  area.innerHTML = `
    <div class="card scorebox">
      <div class="sub">Score final</div>
      <div class="big">${quizScore} / ${quizPool.length}</div>
      <div class="sub">${pct}% — ${msg}</div>
      <button class="primary" id="quiz-retry">🔄 Refaire le quiz</button>
    </div>
  `;
  document.getElementById('quiz-retry').addEventListener('click', startQuiz);
}

document.getElementById('restart-quiz').addEventListener('click', startQuiz);
document.getElementById('cat-select').addEventListener('change', startQuiz);

/* ============================================================
   FLASHCARDS LOGIC
   ============================================================ */
function startFlash(){
  const cat = document.getElementById('flash-cat-select').value;
  const source = cat === 'all' ? FLASHCARDS : FLASHCARDS.filter(f => f.cat === cat);
  flashPool = [...source];
  flashIndex = 0;
  flashFlipped = false;
  renderFlash();
}

function renderFlash(){
  const card = document.getElementById('flashcard');
  const tag = document.getElementById('flash-tag');
  const content = document.getElementById('flash-content');
  const counter = document.getElementById('flash-counter');

  if(flashPool.length === 0){
    tag.textContent = '';
    content.innerHTML = 'Aucune carte dans cette catégorie.';
    counter.textContent = '';
    return;
  }

  const item = flashPool[flashIndex];
  tag.textContent = item.cat;
  content.innerHTML = flashFlipped
    ? `<span class="flash-answer">${item.a}</span>`
    : item.q;
  counter.textContent = `Carte ${flashIndex+1} / ${flashPool.length} — su : ${flashKnown.size}`;
}

document.getElementById('flashcard').addEventListener('click', () => {
  flashFlipped = !flashFlipped;
  renderFlash();
});

document.getElementById('btn-next-flash').addEventListener('click', () => {
  if(flashPool.length === 0) return;
  flashFlipped = false;
  flashIndex = (flashIndex + 1) % flashPool.length;
  renderFlash();
});
document.getElementById('btn-prev-flash').addEventListener('click', () => {
  if(flashPool.length === 0) return;
  flashFlipped = false;
  flashIndex = (flashIndex - 1 + flashPool.length) % flashPool.length;
  renderFlash();
});
document.getElementById('btn-know').addEventListener('click', () => {
  if(flashPool.length === 0) return;
  flashKnown.add(flashPool[flashIndex].q);
  document.getElementById('btn-next-flash').click();
});
document.getElementById('btn-dontknow').addEventListener('click', () => {
  document.getElementById('btn-next-flash').click();
});
document.getElementById('shuffle-flash').addEventListener('click', () => {
  flashPool = shuffle(flashPool);
  flashIndex = 0;
  flashFlipped = false;
  renderFlash();
});
document.getElementById('reset-flash').addEventListener('click', () => {
  flashKnown.clear();
  startFlash();
});
document.getElementById('flash-cat-select').addEventListener('change', startFlash);

/* ============================================================
   INIT
   ============================================================ */
populateCatSelect();
startQuiz();
startFlash();
</script>
</body>
</html>
